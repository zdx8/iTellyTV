name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Decode keystore + write properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set"
            exit 1
          fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > app/signing/itellytv-release.keystore
          chmod 600 app/signing/itellytv-release.keystore
          # Written with printf rather than a heredoc: inside a YAML block
          # scalar every line is indented, and an indented heredoc
          # terminator does not terminate — the remaining commands would
          # silently be appended to keystore.properties as extra
          # "properties" instead of running.
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_ALIAS_PASSWORD"
            printf 'keyAlias=itellytv-release\n'
            printf 'storeFile=app/signing/itellytv-release.keystore\n'
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug + signed release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Get tag
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename + checksums
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "iTellyTV-${TAG}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk \
               "iTellyTV-${TAG}-release.apk"
          else
            echo "::warning::Release APK not produced (signing probably failed)"
          fi
          for f in iTellyTV-${TAG}-*.apk; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload signed release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTellyTV-release-${{ steps.tag.outputs.TAG }}
          path: |
            iTellyTV-${{ steps.tag.outputs.TAG }}-release.apk
            iTellyTV-${{ steps.tag.outputs.TAG }}-release.apk.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: iTellyTV ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
          files: |
            iTellyTV-${{ steps.tag.outputs.TAG }}-debug.apk
            iTellyTV-${{ steps.tag.outputs.TAG }}-debug.apk.sha256
            iTellyTV-${{ steps.tag.outputs.TAG }}-release.apk
            iTellyTV-${{ steps.tag.outputs.TAG }}-release.apk.sha256
